<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis Results — Alzheimer AI</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link href="https://jsdelivr.net" rel="stylesheet"/>
  <link rel="stylesheet" href="static/css/styles.css">

  <style>
    :root {
      --bg: #0a0c12;
      --navy-mid: #11141e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e4db;
      --muted: #7a7f92;
      --gold: #c9a84c;
      --green: #4cac7d;
      --red: #c94c4c;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; margin: 0; }
    .container { max-width: 800px; margin: 80px auto; padding: 0 24px; }
    .result-card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 14px; padding: 48px; text-align: center; }
    .result-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; }
    .result-value { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; color: var(--gold); margin-bottom: 24px; font-weight: 500; }
    .result-desc { font-size: 1rem; color: var(--muted); line-height: 1.6; max-width: 550px; margin: 0 auto 32px; }
    .btn-return { display: inline-block; padding: 12px 32px; background: var(--gold); color: #0a0c12; border: none; border-radius: 6px; font-weight: 700; text-transform: uppercase; text-decoration: none; font-size: 0.82rem; transition: background 0.2s; }
    .btn-return:hover { background: #e0c67a; }
  </style>
</head>
<body>

<div class="container">
  <div class="result-card">
    <div class="result-label">Assessment Result</div>
    <div class="result-value" id="prediction-text">Processing...</div>
    <p class="result-desc" id="prediction-desc">Evaluating patient details using cognitive assessment and tabular indicators.</p>
    <a href="dashboard.html" class="btn-return">Go to Dashboard</a>
  </div>
</div>

<script>
  // قراءة النتيجة المخزنة في الـ Session وإظهارها فوراً
  const prediction = sessionStorage.getItem('prediction_result');
  const resultElement = document.getElementById('prediction-text');
  const descElement = document.getElementById('prediction-desc');

  if (prediction) {
    resultElement.textContent = prediction;

    // تخصيص النص بناءً على النتيجة المستلمة من الـ Random Forest
    if (prediction.toLowerCase().includes('normal') || prediction.toLowerCase().includes('nondemented')) {
      resultElement.style.color = "var(--green)";
      descElement.textContent = "Great news! The test result indicates that cognitive function is in the normal range. No immediate risk detected.";
    } else {
      resultElement.style.color = "var(--red)";
      descElement.textContent = "The test indicates patterns associated with cognitive impairment or Alzheimer's. We strongly recommend consulting a medical professional.";
    }
  } else {
    resultElement.textContent = "No Result Available";
    descElement.textContent = "Please go back to the dashboard and enter the data again.";
  }
</script>

</body>
</html>
